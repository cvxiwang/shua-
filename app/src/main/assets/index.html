<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷题助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-danger {
            background: #ff4757;
        }
        .btn-success {
            background: #2ed573;
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: #666;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .question-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .question-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .type-choice { background: #e3f2fd; color: #1976d2; }
        .type-judge { background: #fff3e0; color: #f57c00; }
        .type-short { background: #e8f5e9; color: #388e3c; }
        .question-text {
            font-size: 18px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #667eea;
        }
        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.correct {
            border-color: #2ed573;
            background: #e8f9ef;
        }
        .option.wrong {
            border-color: #ff4757;
            background: #ffe8ea;
        }
        .option.disabled {
            pointer-events: none;
        }
        .answer-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            min-height: 100px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        .progress {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .answer-reveal {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }
        .answer-reveal strong {
            color: #856404;
        }
        .reference-answer-box {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .reference-answer-box .title {
            color: #2e7d32;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reference-answer-box .content {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .nav .btn {
            flex: 1;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .tab-bar {
            display: flex;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .wrong-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #ff4757;
        }
        .wrong-item .question {
            font-weight: 500;
            margin-bottom: 8px;
        }
        .wrong-item .your-answer {
            color: #ff4757;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .wrong-item .correct-answer {
            color: #2ed573;
            font-size: 14px;
        }
        .type-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .type-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .type-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .question-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
        }
        .question-item .type-tag {
            position: absolute;
            top: 12px;
            right: 12px;
        }
        .delete-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
        }
        .result-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
        }
        .result-correct {
            background: #e8f9ef;
            color: #2ed573;
        }
        .result-wrong {
            background: #ffe8ea;
            color: #ff4757;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .action-buttons .btn {
            flex: 1;
            min-width: 120px;
        }
        .hint-text {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 刷题助手</h1>
            <p>高效学习，本地存储</p>
        </div>

        <div class="tab-bar">
            <div class="tab active" onclick="showPage('home')">首页</div>
            <div class="tab" onclick="showPage('questions')">题库</div>
            <div class="tab" onclick="showPage('practice')">练习</div>
            <div class="tab" onclick="showPage('wrong')">错题</div>
        </div>

        <!-- 首页 -->
        <div id="page-home">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-practiced">0</div>
                    <div class="stat-label">已练习</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-correct">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-wrong">0</div>
                    <div class="stat-label">错题数</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">快速开始</div>
                <button class="btn" onclick="startPractice('random')">🎲 随机练习</button>
                <button class="btn btn-secondary" onclick="startPractice('sequence')">📝 顺序练习</button>
                <button class="btn btn-secondary" onclick="startPractice('wrong')">❌ 错题练习</button>
            </div>

            <div class="card">
                <div class="card-title">练习设置</div>
                <div class="form-group">
                    <label>每次练习题数</label>
                    <input type="number" id="practice-count" value="10" min="1" max="100">
                </div>
            </div>
        </div>

        <!-- 题库管理 -->
        <div id="page-questions" class="hidden">
            <div class="card">
                <div class="card-title">添加题目</div>
                
                <div class="type-selector">
                    <div class="type-btn active" id="type-choice" onclick="selectQuestionType('choice')">选择题</div>
                    <div class="type-btn" id="type-judge" onclick="selectQuestionType('judge')">判断题</div>
                    <div class="type-btn" id="type-short" onclick="selectQuestionType('short')">简答题</div>
                </div>
                
                <input type="hidden" id="q-type" value="choice">
                
                <div class="form-group">
                    <label>题目内容</label>
                    <textarea id="q-text" placeholder="请输入题目内容..."></textarea>
                </div>
                
                <!-- 选择题选项 -->
                <div id="choice-options">
                    <div class="form-group">
                        <label>选项A</label>
                        <input type="text" id="q-a" placeholder="选项A">
                    </div>
                    <div class="form-group">
                        <label>选项B</label>
                        <input type="text" id="q-b" placeholder="选项B">
                    </div>
                    <div class="form-group">
                        <label>选项C</label>
                        <input type="text" id="q-c" placeholder="选项C（可选）">
                    </div>
                    <div class="form-group">
                        <label>选项D</label>
                        <input type="text" id="q-d" placeholder="选项D（可选）">
                    </div>
                    <div class="form-group">
                        <label>正确答案</label>
                        <select id="q-answer-choice">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                </div>
                
                <!-- 判断题选项 -->
                <div id="judge-options" class="hidden">
                    <div class="form-group">
                        <label>正确答案</label>
                        <select id="q-answer-judge">
                            <option value="正确">正确 ✓</option>
                            <option value="错误">错误 ✗</option>
                        </select>
                    </div>
                </div>
                
                <!-- 简答题 -->
                <div id="short-options" class="hidden">
                    <div class="form-group">
                        <label>参考答案</label>
                        <textarea id="q-answer-short" placeholder="请输入参考答案..." style="min-height: 120px;"></textarea>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>答案解析（可选）</label>
                    <textarea id="q-explain" placeholder="输入解析..."></textarea>
                </div>
                
                <button class="btn" onclick="addQuestion()">添加题目</button>
            </div>

            <div class="card">
                <div class="card-title">批量导入</div>
                <div class="form-group">
                    <label>选择题格式：题目|A选项|B选项|C选项|D选项|答案|解析</label>
                    <label>判断题格式：题目|答案(正确/错误)|解析</label>
                    <label>简答题格式：题目|参考答案|解析</label>
                    <textarea id="q-batch" rows="6" placeholder="每行一题，示例：&#10;1+1等于几？|1|2|3|4|B|基础数学&#10;地球是圆的|正确|地理常识&#10;简述光合作用过程|植物利用阳光...|生物知识"></textarea>
                </div>
                <button class="btn btn-secondary" onclick="batchImport()">批量导入</button>
            </div>

            <div id="questions-list"></div>
        </div>

        <!-- 练习页面 -->
        <div id="page-practice" class="hidden">
            <div class="progress">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
            <div id="practice-info" style="text-align:center; margin-bottom:12px; color:#666;">
                <span id="current-num">1</span> / <span id="total-num">10</span>
            </div>
            <div id="practice-content"></div>
            <div id="practice-nav"></div>
        </div>

        <!-- 错题本 -->
        <div id="page-wrong" class="hidden">
            <div class="card">
                <div class="card-title">错题列表 (<span id="wrong-count">0</span>题)</div>
                <button class="btn btn-danger" onclick="clearWrongBook()">清空错题本</button>
            </div>
            <div id="wrong-list"></div>
        </div>
    </div>

    <script>
        // 数据存储
        var questions = [];
        var wrongAnswers = [];
        var practiceHistory = { total: 0, correct: 0 };
        var currentPractice = { 
            questions: [], 
            index: 0, 
            answers: {}, 
            showedAnswer: false,
            answered: false,  // 是否已作答
            isCorrect: null   // 答案是否正确（选择题/判断题）
        };
        var currentPage = 'home';
        var currentQuestionType = 'choice';

        // 初始化
        function init() {
            loadData();
            updateStats();
            showPage('home');
        }

        // 本地存储
        function loadData() {
            try {
                var q = localStorage.getItem('quiz_questions');
                var w = localStorage.getItem('quiz_wrong');
                var h = localStorage.getItem('quiz_history');
                
                questions = q ? JSON.parse(q) : [];
                wrongAnswers = w ? JSON.parse(w) : [];
                practiceHistory = h ? JSON.parse(h) : { total: 0, correct: 0 };
            } catch(e) {
                console.error('加载数据失败', e);
                questions = [];
                wrongAnswers = [];
                practiceHistory = { total: 0, correct: 0 };
            }
        }

        function saveData() {
            try {
                localStorage.setItem('quiz_questions', JSON.stringify(questions));
                localStorage.setItem('quiz_wrong', JSON.stringify(wrongAnswers));
                localStorage.setItem('quiz_history', JSON.stringify(practiceHistory));
            } catch(e) {
                console.error('保存数据失败', e);
            }
        }

        // 页面切换
        function showPage(page) {
            var pages = document.querySelectorAll('[id^="page-"]');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.add('hidden');
            }
            document.getElementById('page-' + page).classList.remove('hidden');
            
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            var pageNames = ['home', 'questions', 'practice', 'wrong'];
            tabs[pageNames.indexOf(page)].classList.add('active');
            
            currentPage = page;
            
            if (page === 'home') updateStats();
            if (page === 'questions') renderQuestionsList();
            if (page === 'wrong') renderWrongList();
        }

        // 选择题目类型
        function selectQuestionType(type) {
            currentQuestionType = type;
            document.getElementById('q-type').value = type;
            
            document.querySelectorAll('.type-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            document.getElementById('type-' + type).classList.add('active');
            
            document.getElementById('choice-options').classList.add('hidden');
            document.getElementById('judge-options').classList.add('hidden');
            document.getElementById('short-options').classList.add('hidden');
            
            document.getElementById(type + '-options').classList.remove('hidden');
        }

        // 更新统计
        function updateStats() {
            document.getElementById('stat-total').textContent = questions.length;
            document.getElementById('stat-practiced').textContent = practiceHistory.total;
            var rate = practiceHistory.total > 0 ? Math.round(practiceHistory.correct / practiceHistory.total * 100) : 0;
            document.getElementById('stat-correct').textContent = rate + '%';
            document.getElementById('stat-wrong').textContent = wrongAnswers.length;
        }

        // 添加题目
        function addQuestion() {
            var type = currentQuestionType;
            var text = document.getElementById('q-text').value.trim();
            var explain = document.getElementById('q-explain').value.trim();
            
            if (!text) {
                alert('请填写题目内容');
                return;
            }
            
            var q = {
                id: Date.now(),
                type: type,
                text: text,
                explain: explain
            };
            
            if (type === 'choice') {
                q.options = {
                    A: document.getElementById('q-a').value.trim(),
                    B: document.getElementById('q-b').value.trim(),
                    C: document.getElementById('q-c').value.trim(),
                    D: document.getElementById('q-d').value.trim()
                };
                q.answer = document.getElementById('q-answer-choice').value;
                
                if (!q.options.A || !q.options.B) {
                    alert('请至少填写选项A和B');
                    return;
                }
            } else if (type === 'judge') {
                q.answer = document.getElementById('q-answer-judge').value;
            } else if (type === 'short') {
                q.answer = document.getElementById('q-answer-short').value.trim();
                if (!q.answer) {
                    alert('请填写参考答案');
                    return;
                }
            }
            
            questions.push(q);
            saveData();
            
            // 清空表单
            document.getElementById('q-text').value = '';
            document.getElementById('q-explain').value = '';
            document.getElementById('q-a').value = '';
            document.getElementById('q-b').value = '';
            document.getElementById('q-c').value = '';
            document.getElementById('q-d').value = '';
            document.getElementById('q-answer-short').value = '';
            
            alert('添加成功！');
            renderQuestionsList();
        }

        // 批量导入
        function batchImport() {
            var text = document.getElementById('q-batch').value.trim();
            if (!text) return;
            
            var lines = text.split('\n');
            var count = 0;
            
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                
                var parts = line.split('|');
                if (parts.length < 2) continue;
                
                var q = {
                    id: Date.now() + count,
                    type: 'choice',
                    text: parts[0].trim(),
                    explain: ''
                };
                
                // 判断题目类型
                if (parts.length >= 6 && (parts[5] === 'A' || parts[5] === 'B' || parts[5] === 'C' || parts[5] === 'D')) {
                    // 选择题
                    q.type = 'choice';
                    q.options = {
                        A: parts[1].trim(),
                        B: parts[2].trim(),
                        C: parts[3].trim(),
                        D: parts[4].trim()
                    };
                    q.answer = parts[5].trim().toUpperCase();
                    if (parts[6]) q.explain = parts[6].trim();
                } else if (parts[1] === '正确' || parts[1] === '错误') {
                    // 判断题
                    q.type = 'judge';
                    q.answer = parts[1].trim();
                    if (parts[2]) q.explain = parts[2].trim();
                } else if (parts.length >= 2) {
                    // 简答题
                    q.type = 'short';
                    q.answer = parts[1].trim();
                    if (parts[2]) q.explain = parts[2].trim();
                } else {
                    continue;
                }
                
                questions.push(q);
                count++;
            }
            
            saveData();
            document.getElementById('q-batch').value = '';
            alert('成功导入 ' + count + ' 道题目');
            renderQuestionsList();
        }

        // 渲染题目列表
        function renderQuestionsList() {
            var container = document.getElementById('questions-list');
            if (questions.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无题目，请添加题目</p></div>';
                return;
            }
            
            var typeNames = { choice: '选择题', judge: '判断题', short: '简答题' };
            var html = '';
            
            var displayQuestions = questions.slice(0, 30);
            for (var i = 0; i < displayQuestions.length; i++) {
                var q = displayQuestions[i];
                html += '<div class="question-item">';
                html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
                html += '<div class="question-text">' + (i + 1) + '. ' + q.text + '</div>';
                html += '<div style="color: #2ed573; font-size: 14px;">答案: ' + q.answer + '</div>';
                html += '<button class="btn btn-secondary btn-small delete-btn" onclick="deleteQuestion(' + q.id + ')">删除</button>';
                html += '</div>';
            }
            
            if (questions.length > 30) {
                html += '<p style="text-align:center;color:#666;padding:12px;">显示前30题，共' + questions.length + '题</p>';
            }
            
            container.innerHTML = html;
        }

        // 删除题目
        function deleteQuestion(id) {
            if (confirm('确定删除此题目？')) {
                questions = questions.filter(function(q) { return q.id !== id; });
                wrongAnswers = wrongAnswers.filter(function(w) { return w.questionId !== id; });
                saveData();
                renderQuestionsList();
            }
        }

        // 开始练习
        function startPractice(mode) {
            if (questions.length === 0) {
                alert('题库为空，请先添加题目');
                return;
            }
            
            var count = parseInt(document.getElementById('practice-count').value) || 10;
            var pool = [];
            
            if (mode === 'wrong') {
                for (var i = 0; i < wrongAnswers.length; i++) {
                    var q = null;
                    for (var j = 0; j < questions.length; j++) {
                        if (questions[j].id === wrongAnswers[i].questionId) {
                            q = questions[j];
                            break;
                        }
                    }
                    if (q) pool.push(q);
                }
                if (pool.length === 0) {
                    alert('错题本为空');
                    return;
                }
            } else {
                pool = questions.slice();
            }
            
            if (mode === 'random') {
                // 洗牌算法
                for (var i = pool.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = pool[i];
                    pool[i] = pool[j];
                    pool[j] = temp;
                }
            }
            
            currentPractice = {
                questions: pool.slice(0, count),
                index: 0,
                answers: {},
                showedAnswer: false,
                answered: false,
                isCorrect: null
            };
            
            showPage('practice');
            renderQuestion();
        }

        // 渲染当前题目
        function renderQuestion() {
            var q = currentPractice.questions[currentPractice.index];
            if (!q) {
                finishPractice();
                return;
            }
            
            var total = currentPractice.questions.length;
            var current = currentPractice.index + 1;
            
            document.getElementById('current-num').textContent = current;
            document.getElementById('total-num').textContent = total;
            document.getElementById('progress-bar').style.width = (current / total * 100) + '%';
            
            var userAnswer = currentPractice.answers[q.id];
            var typeNames = { choice: '选择题', judge: '判断题', short: '简答题' };
            
            var html = '<div class="question-card">';
            html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
            html += '<div class="question-text">' + q.text + '</div>';
            
            // 选择题
            if (q.type === 'choice') {
                html += '<div class="options">';
                var opts = ['A', 'B', 'C', 'D'];
                for (var i = 0; i < opts.length; i++) {
                    var opt = opts[i];
                    if (q.options[opt]) {
                        var className = 'option';
                        if (currentPractice.answered) {
                            className += ' disabled';
                            if (opt === q.answer) {
                                className += ' correct';
                            } else if (userAnswer === opt && userAnswer !== q.answer) {
                                className += ' wrong';
                            }
                        } else if (userAnswer === opt) {
                            className += ' selected';
                        }
                        html += '<div class="' + className + '" onclick="selectChoiceAnswer(\'' + opt + '\')">' + opt + '. ' + q.options[opt] + '</div>';
                    }
                }
                html += '</div>';
                
                // 显示判断结果
                if (currentPractice.answered) {
                    if (currentPractice.isCorrect) {
                        html += '<div class="result-badge result-correct">✓ 回答正确！</div>';
                    } else {
                        html += '<div class="result-badge result-wrong">✗ 回答错误</div>';
                        html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong></div>';
                    }
                    if (q.explain) {
                        html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                    }
                }
            }
            // 判断题
            else if (q.type === 'judge') {
                html += '<div class="options">';
                var judgeOpts = ['正确', '错误'];
                for (var i = 0; i < judgeOpts.length; i++) {
                    var opt = judgeOpts[i];
                    var className = 'option';
                    if (currentPractice.answered) {
                        className += ' disabled';
                        if (opt === q.answer) {
                            className += ' correct';
                        } else if (userAnswer === opt && userAnswer !== q.answer) {
                            className += ' wrong';
                        }
                    } else if (userAnswer === opt) {
                        className += ' selected';
                    }
                    html += '<div class="' + className + '" onclick="selectJudgeAnswer(\'' + opt + '\')">' + opt + '</div>';
                }
                html += '</div>';
                
                // 显示判断结果
                if (currentPractice.answered) {
                    if (currentPractice.isCorrect) {
                        html += '<div class="result-badge result-correct">✓ 回答正确！</div>';
                    } else {
                        html += '<div class="result-badge result-wrong">✗ 回答错误</div>';
                        html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong></div>';
                    }
                    if (q.explain) {
                        html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                    }
                }
            }
            // 简答题
            else if (q.type === 'short') {
                html += '<div class="form-group" style="margin-top:12px;">';
                html += '<label>你的答案：</label>';
                html += '<textarea class="answer-input" id="short-answer-input" placeholder="请输入你的答案..." onchange="saveShortAnswer()">' + (userAnswer || '') + '</textarea>';
                html += '</div>';
                
                // 简答题不判断正误，只显示参考答案
                if (currentPractice.showedAnswer) {
                    html += '<div class="reference-answer-box">';
                    html += '<div class="title">📖 参考答案</div>';
                    html += '<div class="content">' + q.answer + '</div>';
                    html += '</div>';
                    if (q.explain) {
                        html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                    }
                }
            }
            
            html += '</div>';
            
            document.getElementById('practice-content').innerHTML = html;
            
            // 渲染导航按钮
            renderNavigation(q);
        }

        // 渲染导航按钮
        function renderNavigation(q) {
            var html = '';
            
            if (q.type === 'choice' || q.type === 'judge') {
                // 选择题/判断题：已作答后显示"下一题"和"加入错题本"（如果错误）
                if (currentPractice.answered) {
                    html = '<div class="action-buttons">';
                    
                    // 答错时显示加入错题本按钮
                    if (!currentPractice.isCorrect) {
                        html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>';
                    }
                    html += '<button class="btn" onclick="nextQuestion()">下一题 →</button>';
                    html += '</div>';
                } else {
                    html = '<div class="hint-text">请选择答案后继续</div>';
                }
            } else if (q.type === 'short') {
                // 简答题
                html = '<div class="action-buttons">';
                
                // 显示答案按钮
                if (!currentPractice.showedAnswer) {
                    html += '<button class="btn btn-secondary" onclick="showReferenceAnswer()">👁️ 显示答案</button>';
                } else {
                    // 已经显示答案后，可以加入错题本或下一题
                    html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>';
                    html += '<button class="btn" onclick="nextQuestion()">下一题 →</button>';
                }
                
                html += '</div>';
            }
            
            // 上一题按钮（独立一行）
            if (currentPractice.index > 0) {
                html += '<div class="nav" style="margin-top:8px;">';
                html += '<button class="btn btn-secondary" onclick="prevQuestion()">← 上一题</button>';
                html += '</div>';
            }
            
            document.getElementById('practice-nav').innerHTML = html;
        }

        // 选择题选择答案
        function selectChoiceAnswer(opt) {
            if (currentPractice.answered) return;
            
            var q = currentPractice.questions[currentPractice.index];
            currentPractice.answers[q.id] = opt;
            
            // 立即判断正误
            currentPractice.answered = true;
            currentPractice.isCorrect = (opt === q.answer);
            
            // 更新统计
            practiceHistory.total++;
            if (currentPractice.isCorrect) {
                practiceHistory.correct++;
            }
            saveData();
            
            renderQuestion();
        }

        // 判断题选择答案
        function selectJudgeAnswer(opt) {
            if (currentPractice.answered) return;
            
            var q = currentPractice.questions[currentPractice.index];
            currentPractice.answers[q.id] = opt;
            
            // 立即判断正误
            currentPractice.answered = true;
            currentPractice.isCorrect = (opt === q.answer);
            
            // 更新统计
            practiceHistory.total++;
            if (currentPractice.isCorrect) {
                practiceHistory.correct++;
            }
            saveData();
            
            renderQuestion();
        }

        // 保存简答题答案
        function saveShortAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            var input = document.getElementById('short-answer-input');
            if (input) {
                currentPractice.answers[q.id] = input.value.trim();
            }
        }

        // 显示参考答案（简答题）
        function showReferenceAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            var input = document.getElementById('short-answer-input');
            
            // 检查是否填写了答案
            if (!input || !input.value.trim()) {
                alert('请先填写你的答案');
                return;
            }
            
            currentPractice.answers[q.id] = input.value.trim();
            currentPractice.showedAnswer = true;
            currentPractice.answered = true;
            
            // 简答题不计入统计
            saveData();
            renderQuestion();
        }

        // 加入错题本
        function addToWrongBook() {
            var q = currentPractice.questions[currentPractice.index];
            var userAnswer = currentPractice.answers[q.id];
            
            if (!userAnswer) {
                alert('请先作答');
                return;
            }
            
            // 检查是否已在错题本中
            var exists = false;
            for (var i = 0; i < wrongAnswers.length; i++) {
                if (wrongAnswers[i].questionId === q.id) {
                    exists = true;
                    break;
                }
            }
            
            if (!exists) {
                wrongAnswers.push({
                    questionId: q.id,
                    yourAnswer: userAnswer,
                    time: Date.now()
                });
                saveData();
                alert('已加入错题本');
            } else {
                alert('该题已在错题本中');
            }
        }

        // 上一题
        function prevQuestion() {
            if (currentPractice.index > 0) {
                currentPractice.index--;
                // 恢复上一题的状态
                var q = currentPractice.questions[currentPractice.index];
                var userAnswer = currentPractice.answers[q.id];
                
                if (q.type === 'short') {
                    currentPractice.showedAnswer = !!userAnswer;
                    currentPractice.answered = !!userAnswer;
                } else {
                    currentPractice.answered = !!userAnswer;
                    currentPractice.isCorrect = userAnswer === q.answer;
                }
                
                renderQuestion();
            }
        }

        // 下一题
        function nextQuestion() {
            var q = currentPractice.questions[currentPractice.index];
            var userAnswer = currentPractice.answers[q.id];
            
            // 检查是否已作答
            if (!userAnswer) {
                if (q.type === 'short') {
                    alert('请先填写答案');
                } else {
                    alert('请先选择答案');
                }
                return;
            }
            
            currentPractice.index++;
            currentPractice.showedAnswer = false;
            currentPractice.answered = false;
            currentPractice.isCorrect = null;
            
            if (currentPractice.index >= currentPractice.questions.length) {
                finishPractice();
            } else {
                renderQuestion();
            }
        }

        // 完成练习
        function finishPractice() {
            var correct = 0;
            var total = 0;
            
            for (var i = 0; i < currentPractice.questions.length; i++) {
                var q = currentPractice.questions[i];
                var userAnswer = currentPractice.answers[q.id];
                
                // 只统计选择题和判断题
                if (q.type !== 'short') {
                    total++;
                    if (userAnswer === q.answer) {
                        correct++;
                    }
                }
            }
            
            var rate = total > 0 ? Math.round(correct / total * 100) : 0;
            var shortCount = currentPractice.questions.filter(function(q) { return q.type === 'short'; }).length;
            
            var msg = '练习完成！\n';
            if (shortCount > 0) {
                msg += '选择题/判断题: ' + correct + '/' + total + ' (' + rate + '%)\n';
                msg += '简答题: ' + shortCount + ' 题（需人工评分）';
            } else {
                msg += '正确: ' + correct + '/' + total + '\n正确率: ' + rate + '%';
            }
            
            alert(msg);
            showPage('home');
            updateStats();
        }

        // 渲染错题列表
        function renderWrongList() {
            document.getElementById('wrong-count').textContent = wrongAnswers.length;
            var container = document.getElementById('wrong-list');
            
            if (wrongAnswers.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>错题本为空</p></div>';
                return;
            }
            
            var typeNames = { choice: '选择题', judge: '判断题', short: '简答题' };
            var html = '';
            
            for (var i = 0; i < wrongAnswers.length; i++) {
                var w = wrongAnswers[i];
                var q = null;
                for (var j = 0; j < questions.length; j++) {
                    if (questions[j].id === w.questionId) {
                        q = questions[j];
                        break;
                    }
                }
                
                if (!q) continue;
                
                html += '<div class="wrong-item">';
                html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
                html += '<div class="question">' + q.text + '</div>';
                html += '<div class="your-answer">你的答案: ' + w.yourAnswer + '</div>';
                html += '<div class="correct-answer">正确答案: ' + q.answer + '</div>';
                if (q.explain) {
                    html += '<div style="margin-top:8px;font-size:13px;color:#666;">解析: ' + q.explain + '</div>';
                }
                html += '<button class="btn btn-secondary btn-small" style="margin-top:12px;" onclick="removeFromWrong(' + q.id + ')">移除</button>';
                html += '</div>';
            }
            
            container.innerHTML = html;
        }

        // 移除错题
        function removeFromWrong(id) {
            wrongAnswers = wrongAnswers.filter(function(w) { return w.questionId !== id; });
            saveData();
            renderWrongList();
        }

        // 清空错题本
        function clearWrongBook() {
            if (confirm('确定清空错题本？')) {
                wrongAnswers = [];
                saveData();
                renderWrongList();
            }
        }

        // 启动应用
        init();
    </script>
</body>
</html>
