<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷题助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 24px; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #333; }
        .btn { display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 8px; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-danger { background: #ff4757; }
        .btn-success { background: #2ed573; }
        .btn-small { padding: 8px 16px; font-size: 14px; width: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 14px; color: #666; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group select { background-color: #ffffff !important; color: #333333 !important; -webkit-appearance: listbox; appearance: listbox; }
        .form-group select option { background-color: #ffffff !important; color: #333333 !important; padding: 12px; }
        select { background-color: #ffffff !important; color: #333333 !important; }
        select option { background-color: #ffffff !important; color: #333333 !important; }
        .question-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .question-type { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
        .type-choice { background: #e3f2fd; color: #1976d2; }
        .type-multi { background: #f3e5f5; color: #7b1fa2; }
        .type-judge { background: #fff3e0; color: #f57c00; }
        .type-fill { background: #fce4ec; color: #c2185b; }
        .type-short { background: #e8f5e9; color: #388e3c; }
        .question-text { font-size: 18px; margin-bottom: 16px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option { padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option:hover { border-color: #667eea; }
        .option.selected { border-color: #667eea; background: #f0f4ff; }
        .option.multi-selected { border-color: #9c27b0; background: #f3e5f5; }
        .option.correct { border-color: #2ed573; background: #e8f9ef; }
        .option.wrong { border-color: #ff4757; background: #ffe8ea; }
        .option.disabled { pointer-events: none; }
        .answer-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; min-height: 100px; }
        .fill-input { width: 100%; padding: 10px; border: 2px solid #667eea; border-radius: 8px; font-size: 16px; margin: 8px 0; background: #fafafa; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-item { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 12px; color: #666; }
        .progress { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-bar { height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: width 0.3s; }
        .answer-reveal { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .answer-reveal strong { color: #856404; }
        .reference-answer-box { background: #e8f5e9; border: 2px solid #4caf50; border-radius: 12px; padding: 16px; margin-top: 16px; }
        .reference-answer-box .title { color: #2e7d32; font-weight: 600; font-size: 16px; margin-bottom: 8px; }
        .reference-answer-box .content { color: #333; line-height: 1.6; white-space: pre-wrap; }
        .nav { display: flex; gap: 8px; margin-bottom: 16px; }
        .nav .btn { flex: 1; }
        .empty-state { text-align: center; padding: 40px 20px; color: #666; }
        .tab-bar { display: flex; background: white; border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto; }
        .tab { flex: 1; padding: 12px 8px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; color: #666; transition: all 0.2s; white-space: nowrap; }
        .tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .hidden { display: none !important; }
        .wrong-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #ff4757; }
        .wrong-item .question { font-weight: 500; margin-bottom: 8px; }
        .wrong-item .your-answer { color: #ff4757; font-size: 14px; margin-bottom: 4px; }
        .wrong-item .correct-answer { color: #2ed573; font-size: 14px; }
        .type-selector { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .type-btn { flex: 1; min-width: 60px; padding: 8px 6px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 13px; }
        .type-btn.active { border-color: #667eea; background: #f0f4ff; }
        .question-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; position: relative; }
        .question-item .type-tag { position: absolute; top: 12px; right: 12px; }
        .delete-btn { position: absolute; bottom: 12px; right: 12px; }
        .result-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-top: 12px; }
        .result-correct { background: #e8f9ef; color: #2ed573; }
        .result-wrong { background: #ffe8ea; color: #ff4757; }
        .action-buttons { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .action-buttons .btn { flex: 1; min-width: 120px; }
        .hint-text { color: #666; font-size: 14px; margin-top: 8px; font-style: italic; }
        .multi-hint { background: #f3e5f5; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; color: #7b1fa2; }
        .checkbox-icon { display: inline-block; width: 20px; height: 20px; border: 2px solid #7b1fa2; border-radius: 4px; margin-right: 8px; text-align: center; line-height: 16px; font-size: 14px; vertical-align: middle; }
        .checkbox-icon.checked { background: #7b1fa2; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 刷题助手</h1>
            <p>高效学习，本地存储</p>
        </div>

        <div class="tab-bar">
            <div class="tab active" onclick="showPage('home')">首页</div>
            <div class="tab" onclick="showPage('questions')">题库</div>
            <div class="tab" onclick="showPage('practice')">练习</div>
            <div class="tab" onclick="showPage('wrong')">错题</div>
        </div>

        <!-- 首页 -->
        <div id="page-home">
            <div class="stats">
                <div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">总题数</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-practiced">0</div><div class="stat-label">已练习</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-correct">0%</div><div class="stat-label">正确率</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-wrong">0</div><div class="stat-label">错题数</div></div>
            </div>
            <div class="card">
                <div class="card-title">快速开始</div>
                <button class="btn" onclick="startPractice('random')">🎲 随机练习</button>
                <button class="btn btn-secondary" onclick="startPractice('sequence')">📝 顺序练习</button>
                <button class="btn btn-secondary" onclick="startPractice('wrong')">❌ 错题练习</button>
            </div>
            <div class="card">
                <div class="card-title">练习设置</div>
                <div class="form-group">
                    <label>每次练习题数</label>
                    <input type="number" id="practice-count" value="10" min="1" max="100">
                </div>
            </div>
        </div>

        <!-- 题库管理 -->
        <div id="page-questions" class="hidden">
            <div class="card">
                <div class="card-title">添加题目</div>
                
                <div class="type-selector">
                    <div class="type-btn active" id="type-choice" onclick="selectQuestionType('choice')">选择题</div>
                    <div class="type-btn" id="type-multi" onclick="selectQuestionType('multi')">多选题</div>
                    <div class="type-btn" id="type-judge" onclick="selectQuestionType('judge')">判断题</div>
                    <div class="type-btn" id="type-fill" onclick="selectQuestionType('fill')">填空题</div>
                    <div class="type-btn" id="type-short" onclick="selectQuestionType('short')">简答题</div>
                </div>
                
                <input type="hidden" id="q-type" value="choice">
                
                <div class="form-group">
                    <label>题目内容</label>
                    <textarea id="q-text" placeholder="请输入题目内容..."></textarea>
                </div>
                
                <!-- 选择题选项 -->
                <div id="choice-options">
                    <div class="form-group"><label>选项A</label><input type="text" id="q-a" placeholder="选项A"></div>
                    <div class="form-group"><label>选项B</label><input type="text" id="q-b" placeholder="选项B"></div>
                    <div class="form-group"><label>选项C</label><input type="text" id="q-c" placeholder="选项C（可选）"></div>
                    <div class="form-group"><label>选项D</label><input type="text" id="q-d" placeholder="选项D（可选）"></div>
                    <div class="form-group"><label>正确答案</label>
                        <select id="q-answer-choice" style="background:#fff;color:#333;">
                            <option value="A" style="background:#fff;color:#333;">A</option>
                            <option value="B" style="background:#fff;color:#333;">B</option>
                            <option value="C" style="background:#fff;color:#333;">C</option>
                            <option value="D" style="background:#fff;color:#333;">D</option>
                        </select>
                    </div>
                </div>
                
                <!-- 多选题选项 -->
                <div id="multi-options" class="hidden">
                    <div class="form-group"><label>选项A</label><input type="text" id="q-m-a" placeholder="选项A"></div>
                    <div class="form-group"><label>选项B</label><input type="text" id="q-m-b" placeholder="选项B"></div>
                    <div class="form-group"><label>选项C</label><input type="text" id="q-m-c" placeholder="选项C（可选）"></div>
                    <div class="form-group"><label>选项D</label><input type="text" id="q-m-d" placeholder="选项D（可选）"></div>
                    <div class="form-group"><label>正确答案（多选，用英文逗号分隔，如：A,B,C）</label><input type="text" id="q-answer-multi" placeholder="例如：A,B 或 A,B,D"></div>
                </div>
                
                <!-- 判断题选项 -->
                <div id="judge-options" class="hidden">
                    <div class="form-group"><label>正确答案</label>
                        <select id="q-answer-judge" style="background:#fff;color:#333;">
                            <option value="正确" style="background:#fff;color:#333;">正确 ✓</option>
                            <option value="错误" style="background:#fff;color:#333;">错误 ✗</option>
                        </select>
                    </div>
                </div>
                
                <!-- 填空题选项 -->
                <div id="fill-options" class="hidden">
                    <div class="form-group"><label>填空数量</label>
                        <select id="q-fill-count" onchange="updateFillInputs()" style="background:#fff;color:#333;">
                            <option value="1" style="background:#fff;color:#333;">1个空</option>
                            <option value="2" style="background:#fff;color:#333;">2个空</option>
                            <option value="3" style="background:#fff;color:#333;">3个空</option>
                            <option value="4" style="background:#fff;color:#333;">4个空</option>
                            <option value="5" style="background:#fff;color:#333;">5个空</option>
                        </select>
                    </div>
                    <div id="fill-answers"><div class="form-group"><label>第1空答案</label><input type="text" id="q-fill-1" placeholder="填空答案"></div></div>
                    <p style="color:#666;font-size:12px;margin-top:8px;">提示：在题目内容中使用 ___ 或 （） 表示填空位置</p>
                </div>
                
                <!-- 简答题 -->
                <div id="short-options" class="hidden">
                    <div class="form-group"><label>参考答案</label><textarea id="q-answer-short" placeholder="请输入参考答案..." style="min-height: 120px;"></textarea></div>
                </div>
                
                <div class="form-group"><label>答案解析（可选）</label><textarea id="q-explain" placeholder="输入解析..."></textarea></div>
                
                <button class="btn" onclick="addQuestion()">添加题目</button>
            </div>

            <div class="card">
                <div class="card-title">批量导入</div>
                <div class="form-group">
                    <label style="display:block;margin-bottom:4px;">选择题：题目|A|B|C|D|答案|解析</label>
                    <label style="display:block;margin-bottom:4px;">多选题：题目|A|B|C|D|答案(如A,B,C)|解析</label>
                    <label style="display:block;margin-bottom:4px;">判断题：题目|答案(正确/错误)|解析</label>
                    <label style="display:block;margin-bottom:4px;">填空题：题目|答案1|答案2|...|解析</label>
                    <label style="display:block;margin-bottom:4px;">简答题：题目|参考答案|解析</label>
                    <textarea id="q-batch" rows="6" placeholder="每行一题，示例：&#10;1+1等于几？|1|2|3|4|B|基础数学&#10;以下哪些是编程语言？|Python|Java|HTML|CSS|A,B|多选题&#10;地球是圆的|正确|地理常识&#10;中国的首都是___|北京|地理知识&#10;简述光合作用过程|植物利用阳光...|生物知识"></textarea>
                </div>
                <button class="btn btn-secondary" onclick="batchImport()">批量导入</button>
            </div>
            <div id="questions-list"></div>
        </div>

        <!-- 练习页面 -->
        <div id="page-practice" class="hidden">
            <div class="progress"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>
            <div id="practice-info" style="text-align:center; margin-bottom:12px; color:#666;"><span id="current-num">1</span> / <span id="total-num">10</span></div>
            <div id="practice-content"></div>
            <div id="practice-nav"></div>
        </div>

        <!-- 错题本 -->
        <div id="page-wrong" class="hidden">
            <div class="card">
                <div class="card-title">错题列表 (<span id="wrong-count">0</span>题)</div>
                <button class="btn btn-danger" onclick="clearWrongBook()">清空错题本</button>
            </div>
            <div id="wrong-list"></div>
        </div>
    </div>

    <script>
        var questions = [];
        var wrongAnswers = [];
        var practiceHistory = { total: 0, correct: 0 };
        var currentPractice = { questions: [], index: 0, answers: {}, showedAnswer: false, answered: false, isCorrect: null, multiSelected: [] };
        var currentPage = 'home';
        var currentQuestionType = 'choice';

        function init() { loadData(); updateStats(); showPage('home'); }

        function loadData() {
            try {
                var q = localStorage.getItem('quiz_questions');
                var w = localStorage.getItem('quiz_wrong');
                var h = localStorage.getItem('quiz_history');
                questions = q ? JSON.parse(q) : [];
                wrongAnswers = w ? JSON.parse(w) : [];
                practiceHistory = h ? JSON.parse(h) : { total: 0, correct: 0 };
            } catch(e) { questions = []; wrongAnswers = []; practiceHistory = { total: 0, correct: 0 }; }
        }

        function saveData() {
            try {
                localStorage.setItem('quiz_questions', JSON.stringify(questions));
                localStorage.setItem('quiz_wrong', JSON.stringify(wrongAnswers));
                localStorage.setItem('quiz_history', JSON.stringify(practiceHistory));
            } catch(e) {}
        }

        function showPage(page) {
            var pages = document.querySelectorAll('[id^="page-"]');
            for (var i = 0; i < pages.length; i++) pages[i].classList.add('hidden');
            document.getElementById('page-' + page).classList.remove('hidden');
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
            var pageNames = ['home', 'questions', 'practice', 'wrong'];
            tabs[pageNames.indexOf(page)].classList.add('active');
            currentPage = page;
            if (page === 'home') updateStats();
            if (page === 'questions') renderQuestionsList();
            if (page === 'wrong') renderWrongList();
        }

        function selectQuestionType(type) {
            currentQuestionType = type;
            document.getElementById('q-type').value = type;
            document.querySelectorAll('.type-btn').forEach(function(btn) { btn.classList.remove('active'); });
            document.getElementById('type-' + type).classList.add('active');
            document.getElementById('choice-options').classList.add('hidden');
            document.getElementById('multi-options').classList.add('hidden');
            document.getElementById('judge-options').classList.add('hidden');
            document.getElementById('fill-options').classList.add('hidden');
            document.getElementById('short-options').classList.add('hidden');
            if (type === 'choice') document.getElementById('choice-options').classList.remove('hidden');
            else if (type === 'multi') document.getElementById('multi-options').classList.remove('hidden');
            else if (type === 'judge') document.getElementById('judge-options').classList.remove('hidden');
            else if (type === 'fill') { document.getElementById('fill-options').classList.remove('hidden'); updateFillInputs(); }
            else if (type === 'short') document.getElementById('short-options').classList.remove('hidden');
        }

        function updateFillInputs() {
            var count = parseInt(document.getElementById('q-fill-count').value) || 1;
            var html = '';
            for (var i = 1; i <= count; i++) {
                html += '<div class="form-group"><label>第' + i + '空答案</label><input type="text" id="q-fill-' + i + '" placeholder="填空答案"></div>';
            }
            document.getElementById('fill-answers').innerHTML = html;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = questions.length;
            document.getElementById('stat-practiced').textContent = practiceHistory.total;
            var rate = practiceHistory.total > 0 ? Math.round(practiceHistory.correct / practiceHistory.total * 100) : 0;
            document.getElementById('stat-correct').textContent = rate + '%';
            document.getElementById('stat-wrong').textContent = wrongAnswers.length;
        }

        function addQuestion() {
            var type = currentQuestionType;
            var text = document.getElementById('q-text').value.trim();
            var explain = document.getElementById('q-explain').value.trim();
            if (!text) { alert('请填写题目内容'); return; }
            var q = { id: Date.now(), type: type, text: text, explain: explain };
            
            if (type === 'choice') {
                q.options = { A: document.getElementById('q-a').value.trim(), B: document.getElementById('q-b').value.trim(), C: document.getElementById('q-c').value.trim(), D: document.getElementById('q-d').value.trim() };
                q.answer = document.getElementById('q-answer-choice').value;
                if (!q.options.A || !q.options.B) { alert('请至少填写选项A和B'); return; }
            } else if (type === 'multi') {
                q.options = { A: document.getElementById('q-m-a').value.trim(), B: document.getElementById('q-m-b').value.trim(), C: document.getElementById('q-m-c').value.trim(), D: document.getElementById('q-m-d').value.trim() };
                var multiAnswer = document.getElementById('q-answer-multi').value.trim().toUpperCase();
                var answerParts = multiAnswer.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
                answerParts.sort();
                q.answer = answerParts.join(',');
                if (!q.options.A || !q.options.B) { alert('请至少填写选项A和B'); return; }
                if (!q.answer) { alert('请填写正确答案'); return; }
            } else if (type === 'judge') {
                q.answer = document.getElementById('q-answer-judge').value;
            } else if (type === 'fill') {
                var count = parseInt(document.getElementById('q-fill-count').value) || 1;
                q.fillCount = count;
                q.answers = [];
                for (var i = 1; i <= count; i++) {
                    var ans = document.getElementById('q-fill-' + i).value.trim();
                    if (!ans) { alert('请填写第' + i + '空答案'); return; }
                    q.answers.push(ans);
                }
                q.answer = q.answers.join('；');
            } else if (type === 'short') {
                q.answer = document.getElementById('q-answer-short').value.trim();
                if (!q.answer) { alert('请填写参考答案'); return; }
            }
            
            questions.push(q);
            saveData();
            document.getElementById('q-text').value = '';
            document.getElementById('q-explain').value = '';
            alert('添加成功！');
            renderQuestionsList();
        }

        function batchImport() {
            var text = document.getElementById('q-batch').value.trim();
            if (!text) return;
            var lines = text.split('\n');
            var count = 0;
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var parts = line.split('|');
                if (parts.length < 2) continue;
                var q = { id: Date.now() + count, type: 'choice', text: parts[0].trim(), explain: '' };
                var part5 = parts[5] ? parts[5].trim().toUpperCase() : '';
                var part1 = parts[1] ? parts[1].trim() : '';
                
                if (part1 === '正确' || part1 === '错误') {
                    q.type = 'judge'; q.answer = part1;
                    if (parts[2]) q.explain = parts[2].trim();
                } else if (parts.length >= 6 && (part5 === 'A' || part5 === 'B' || part5 === 'C' || part5 === 'D' || part5.includes(','))) {
                    if (part5.includes(',')) {
                        q.type = 'multi';
                        q.options = { A: parts[1].trim(), B: parts[2].trim(), C: parts[3].trim(), D: parts[4].trim() };
                        var answerParts = part5.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
                        answerParts.sort();
                        q.answer = answerParts.join(',');
                        if (parts[6]) q.explain = parts[6].trim();
                    } else {
                        q.type = 'choice';
                        q.options = { A: parts[1].trim(), B: parts[2].trim(), C: parts[3].trim(), D: parts[4].trim() };
                        q.answer = part5;
                        if (parts[6]) q.explain = parts[6].trim();
                    }
                } else if (parts.length >= 2) {
                    var questionText = parts[0].trim();
                    if (questionText.includes('___') || questionText.includes('（') || questionText.includes('(') || questionText.includes('____')) {
                        q.type = 'fill';
                        q.answers = [];
                        for (var j = 1; j < parts.length - 1; j++) {
                            if (parts[j] && parts[j].trim()) q.answers.push(parts[j].trim());
                        }
                        q.fillCount = q.answers.length;
                        q.answer = q.answers.join('；');
                    } else {
                        q.type = 'short';
                        q.answer = parts[1].trim();
                        if (parts[2]) q.explain = parts[2].trim();
                    }
                } else { continue; }
                questions.push(q);
                count++;
            }
            saveData();
            document.getElementById('q-batch').value = '';
            alert('成功导入 ' + count + ' 道题目');
            renderQuestionsList();
        }

        function renderQuestionsList() {
            var container = document.getElementById('questions-list');
            if (questions.length === 0) { container.innerHTML = '<div class="empty-state"><p>暂无题目，请添加题目</p></div>'; return; }
            var typeNames = { choice: '选择题', multi: '多选题', judge: '判断题', fill: '填空题', short: '简答题' };
            var html = '';
            var displayQuestions = questions.slice(0, 30);
            for (var i = 0; i < displayQuestions.length; i++) {
                var q = displayQuestions[i];
                html += '<div class="question-item">';
                html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
                html += '<div class="question-text">' + (i + 1) + '. ' + q.text + '</div>';
                html += '<div style="color: #2ed573; font-size: 14px;">答案: ' + q.answer + '</div>';
                html += '<button class="btn btn-secondary btn-small delete-btn" onclick="deleteQuestion(' + q.id + ')">删除</button>';
                html += '</div>';
            }
            if (questions.length > 30) html += '<p style="text-align:center;color:#666;padding:12px;">显示前30题，共' + questions.length + '题</p>';
            container.innerHTML = html;
        }

        function deleteQuestion(id) {
            if (confirm('确定删除此题目？')) {
                questions = questions.filter(function(q) { return q.id !== id; });
                wrongAnswers = wrongAnswers.filter(function(w) { return w.questionId !== id; });
                saveData();
                renderQuestionsList();
            }
        }

        function startPractice(mode) {
            if (questions.length === 0) { alert('题库为空，请先添加题目'); return; }
            var count = parseInt(document.getElementById('practice-count').value) || 10;
            var pool = [];
            if (mode === 'wrong') {
                for (var i = 0; i < wrongAnswers.length; i++) {
                    var q = null;
                    for (var j = 0; j < questions.length; j++) { if (questions[j].id === wrongAnswers[i].questionId) { q = questions[j]; break; } }
                    if (q) pool.push(q);
                }
                if (pool.length === 0) { alert('错题本为空'); return; }
            } else { pool = questions.slice(); }
            if (mode === 'random') {
                for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var temp = pool[i]; pool[i] = pool[j]; pool[j] = temp; }
            }
            currentPractice = { questions: pool.slice(0, count), index: 0, answers: {}, showedAnswer: false, answered: false, isCorrect: null, multiSelected: [] };
            showPage('practice');
            renderQuestion();
        }

        function renderQuestion() {
            var q = currentPractice.questions[currentPractice.index];
            if (!q) { finishPractice(); return; }
            var total = currentPractice.questions.length;
            var current = currentPractice.index + 1;
            document.getElementById('current-num').textContent = current;
            document.getElementById('total-num').textContent = total;
            document.getElementById('progress-bar').style.width = (current / total * 100) + '%';
            var userAnswer = currentPractice.answers[q.id];
            var typeNames = { choice: '选择题', multi: '多选题', judge: '判断题', fill: '填空题', short: '简答题' };
            var html = '<div class="question-card">';
            html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
            html += '<div class="question-text">' + q.text + '</div>';
            
            if (q.type === 'choice') {
                html += '<div class="options">';
                var opts = ['A', 'B', 'C', 'D'];
                for (var i = 0; i < opts.length; i++) {
                    var opt = opts[i];
                    if (q.options[opt]) {
                        var className = 'option';
                        if (currentPractice.answered) {
                            className += ' disabled';
                            if (opt === q.answer) className += ' correct';
                            else if (userAnswer === opt) className += ' wrong';
                        } else if (userAnswer === opt) className += ' selected';
                        html += '<div class="' + className + '" onclick="selectChoiceAnswer(\'' + opt + '\')">' + opt + '. ' + q.options[opt] + '</div>';
                    }
                }
                html += '</div>';
                if (currentPractice.answered) {
                    if (currentPractice.isCorrect) html += '<div class="result-badge result-correct">✓ 回答正确！</div>';
                    else { html += '<div class="result-badge result-wrong">✗ 回答错误</div>'; html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong></div>'; }
                    if (q.explain) html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                }
            } else if (q.type === 'multi') {
                html += '<div class="multi-hint">📢 本题为多选题，请选择所有正确选项</div>';
                html += '<div class="options">';
                var opts = ['A', 'B', 'C', 'D'];
                var selectedOpts = currentPractice.multiSelected || [];
                for (var i = 0; i < opts.length; i++) {
                    var opt = opts[i];
                    if (q.options[opt]) {
                        var className = 'option';
                        if (currentPractice.answered) {
                            className += ' disabled';
                            var correctAnswers = q.answer.split(',');
                            var isSelected = selectedOpts.indexOf(opt) >= 0;
                            var shouldBeSelected = correctAnswers.indexOf(opt) >= 0;
                            if (shouldBeSelected) className += ' correct';
                            else if (isSelected) className += ' wrong';
                        } else if (selectedOpts.indexOf(opt) >= 0) className += ' multi-selected';
                        html += '<div class="' + className + '" onclick="toggleMultiOption(\'' + opt + '\')">';
                        html += '<span class="checkbox-icon ' + (selectedOpts.indexOf(opt) >= 0 ? 'checked' : '') + '">' + (selectedOpts.indexOf(opt) >= 0 ? '✓' : '') + '</span>';
                        html += opt + '. ' + q.options[opt] + '</div>';
                    }
                }
                html += '</div>';
                if (currentPractice.answered) {
                    if (currentPractice.isCorrect) html += '<div class="result-badge result-correct">✓ 回答正确！</div>';
                    else { html += '<div class="result-badge result-wrong">✗ 回答错误</div>'; html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong></div>'; }
                    if (q.explain) html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                }
            } else if (q.type === 'judge') {
                html += '<div class="options">';
                var judgeOpts = ['正确', '错误'];
                for (var i = 0; i < judgeOpts.length; i++) {
                    var opt = judgeOpts[i];
                    var className = 'option';
                    if (currentPractice.answered) {
                        className += ' disabled';
                        if (opt === q.answer) className += ' correct';
                        else if (userAnswer === opt) className += ' wrong';
                    } else if (userAnswer === opt) className += ' selected';
                    html += '<div class="' + className + '" onclick="selectJudgeAnswer(\'' + opt + '\')">' + opt + '</div>';
                }
                html += '</div>';
                if (currentPractice.answered) {
                    if (currentPractice.isCorrect) html += '<div class="result-badge result-correct">✓ 回答正确！</div>';
                    else { html += '<div class="result-badge result-wrong">✗ 回答错误</div>'; html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong></div>'; }
                    if (q.explain) html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                }
            } else if (q.type === 'fill') {
                html += '<div style="margin-top:12px;">';
                for (var i = 0; i < q.fillCount; i++) {
                    html += '<div class="form-group"><label>第' + (i + 1) + '空</label>';
                    var fillVal = (userAnswer && userAnswer.fills) ? (userAnswer.fills[i] || '') : '';
                    html += '<input type="text" class="fill-input" id="fill-input-' + i + '" placeholder="请填写答案..." value="' + fillVal + '" onchange="saveFillAnswer()"></div>';
                }
                html += '</div>';
                if (currentPractice.showedAnswer) {
                    html += '<div class="reference-answer-box"><div class="title">📖 参考答案</div><div class="content">';
                    for (var i = 0; i < q.fillCount; i++) html += '<div style="margin:8px 0;"><strong>第' + (i + 1) + '空：</strong>' + q.answers[i] + '</div>';
                    html += '</div></div>';
                    if (q.explain) html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                }
            } else if (q.type === 'short') {
                html += '<div class="form-group" style="margin-top:12px;"><label>你的答案：</label>';
                html += '<textarea class="answer-input" id="short-answer-input" placeholder="请输入你的答案..." onchange="saveShortAnswer()">' + (userAnswer || '') + '</textarea></div>';
                if (currentPractice.showedAnswer) {
                    html += '<div class="reference-answer-box"><div class="title">📖 参考答案</div><div class="content">' + q.answer + '</div></div>';
                    if (q.explain) html += '<div style="margin-top:12px;padding:12px;background:#f8f9fa;border-radius:8px;"><strong>解析：</strong>' + q.explain + '</div>';
                }
            }
            html += '</div>';
            document.getElementById('practice-content').innerHTML = html;
            renderNavigation(q);
        }

        function renderNavigation(q) {
            var html = '';
            if (q.type === 'choice' || q.type === 'judge') {
                if (currentPractice.answered) {
                    html = '<div class="action-buttons">';
                    if (!currentPractice.isCorrect) html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>';
                    html += '<button class="btn" onclick="nextQuestion()">下一题 →</button></div>';
                } else html = '<div class="hint-text">请选择答案后继续</div>';
            } else if (q.type === 'multi') {
                if (currentPractice.answered) {
                    html = '<div class="action-buttons">';
                    if (!currentPractice.isCorrect) html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>';
                    html += '<button class="btn" onclick="nextQuestion()">下一题 →</button></div>';
                } else {
                    html = '<div class="action-buttons"><button class="btn btn-secondary" onclick="confirmMultiAnswer()">✓ 确认答案</button></div>';
                    html += '<div class="hint-text">已选择 ' + (currentPractice.multiSelected.length || 0) + ' 个选项</div>';
                }
            } else if (q.type === 'fill') {
                html = '<div class="action-buttons">';
                if (!currentPractice.showedAnswer) html += '<button class="btn btn-secondary" onclick="showFillAnswer()">👁️ 显示答案</button>';
                else { html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>'; html += '<button class="btn" onclick="nextQuestion()">下一题 →</button>'; }
                html += '</div>';
            } else if (q.type === 'short') {
                html = '<div class="action-buttons">';
                if (!currentPractice.showedAnswer) html += '<button class="btn btn-secondary" onclick="showReferenceAnswer()">👁️ 显示答案</button>';
                else { html += '<button class="btn btn-danger" onclick="addToWrongBook()">❌ 加入错题本</button>'; html += '<button class="btn" onclick="nextQuestion()">下一题 →</button>'; }
                html += '</div>';
            }
            if (currentPractice.index > 0) html += '<div class="nav" style="margin-top:8px;"><button class="btn btn-secondary" onclick="prevQuestion()">← 上一题</button></div>';
            document.getElementById('practice-nav').innerHTML = html;
        }

        function selectChoiceAnswer(opt) {
            if (currentPractice.answered) return;
            var q = currentPractice.questions[currentPractice.index];
            currentPractice.answers[q.id] = opt;
            currentPractice.answered = true;
            currentPractice.isCorrect = (opt === q.answer);
            practiceHistory.total++;
            if (currentPractice.isCorrect) practiceHistory.correct++;
            saveData();
            renderQuestion();
        }

        function toggleMultiOption(opt) {
            if (currentPractice.answered) return;
            var idx = currentPractice.multiSelected.indexOf(opt);
            if (idx >= 0) currentPractice.multiSelected.splice(idx, 1);
            else currentPractice.multiSelected.push(opt);
            currentPractice.multiSelected.sort();
            renderQuestion();
        }

        function confirmMultiAnswer() {
            if (currentPractice.multiSelected.length === 0) { alert('请至少选择一个选项'); return; }
            var q = currentPractice.questions[currentPractice.index];
            var userAnswer = currentPractice.multiSelected.join(',');
            currentPractice.answers[q.id] = userAnswer;
            currentPractice.answered = true;
            currentPractice.isCorrect = (userAnswer === q.answer);
            practiceHistory.total++;
            if (currentPractice.isCorrect) practiceHistory.correct++;
            saveData();
            renderQuestion();
        }

        function selectJudgeAnswer(opt) {
            if (currentPractice.answered) return;
            var q = currentPractice.questions[currentPractice.index];
            currentPractice.answers[q.id] = opt;
            currentPractice.answered = true;
            currentPractice.isCorrect = (opt === q.answer);
            practiceHistory.total++;
            if (currentPractice.isCorrect) practiceHistory.correct++;
            saveData();
            renderQuestion();
        }

        function saveFillAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            var fills = [];
            for (var i = 0; i < q.fillCount; i++) {
                var input = document.getElementById('fill-input-' + i);
                if (input) fills.push(input.value.trim());
            }
            currentPractice.answers[q.id] = { fills: fills };
        }

        function showFillAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            saveFillAnswer();
            var userAnswer = currentPractice.answers[q.id];
            for (var i = 0; i < q.fillCount; i++) {
                if (!userAnswer.fills[i]) { alert('请填写所有空格'); return; }
            }
            currentPractice.showedAnswer = true;
            currentPractice.answered = true;
            saveData();
            renderQuestion();
        }

        function saveShortAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            var input = document.getElementById('short-answer-input');
            if (input) currentPractice.answers[q.id] = input.value.trim();
        }

        function showReferenceAnswer() {
            var q = currentPractice.questions[currentPractice.index];
            var input = document.getElementById('short-answer-input');
            if (!input || !input.value.trim()) { alert('请先填写你的答案'); return; }
            currentPractice.answers[q.id] = input.value.trim();
            currentPractice.showedAnswer = true;
            currentPractice.answered = true;
            saveData();
            renderQuestion();
        }

        function addToWrongBook() {
            var q = currentPractice.questions[currentPractice.index];
            var userAnswer = currentPractice.answers[q.id];
            var displayAnswer = '';
            if (q.type === 'fill' && userAnswer && userAnswer.fills) displayAnswer = userAnswer.fills.join('；');
            else if (q.type === 'multi') displayAnswer = currentPractice.multiSelected.join(',');
            else if (typeof userAnswer === 'string') displayAnswer = userAnswer;
            if (!displayAnswer) { alert('请先作答'); return; }
            var exists = false;
            for (var i = 0; i < wrongAnswers.length; i++) { if (wrongAnswers[i].questionId === q.id) { exists = true; break; } }
            if (!exists) { wrongAnswers.push({ questionId: q.id, yourAnswer: displayAnswer, time: Date.now() }); saveData(); alert('已加入错题本'); }
            else alert('该题已在错题本中');
        }

        function prevQuestion() {
            if (currentPractice.index > 0) {
                currentPractice.index--;
                var q = currentPractice.questions[currentPractice.index];
                var userAnswer = currentPractice.answers[q.id];
                if (q.type === 'short' || q.type === 'fill') { currentPractice.showedAnswer = !!userAnswer; currentPractice.answered = !!userAnswer; }
                else if (q.type === 'multi') { currentPractice.answered = !!userAnswer; currentPractice.multiSelected = userAnswer ? userAnswer.split(',') : []; currentPractice.isCorrect = userAnswer === q.answer; }
                else { currentPractice.answered = !!userAnswer; currentPractice.isCorrect = userAnswer === q.answer; }
                renderQuestion();
            }
        }

        function nextQuestion() {
            var q = currentPractice.questions[currentPractice.index];
            var userAnswer = currentPractice.answers[q.id];
            if (!userAnswer) { alert('请先作答'); return; }
            currentPractice.index++;
            currentPractice.showedAnswer = false;
            currentPractice.answered = false;
            currentPractice.isCorrect = null;
            currentPractice.multiSelected = [];
            if (currentPractice.index >= currentPractice.questions.length) finishPractice();
            else renderQuestion();
        }

        function finishPractice() {
            var correct = 0, total = 0;
            for (var i = 0; i < currentPractice.questions.length; i++) {
                var q = currentPractice.questions[i];
                var userAnswer = currentPractice.answers[q.id];
                if (q.type === 'choice' || q.type === 'multi' || q.type === 'judge') {
                    total++;
                    if (userAnswer === q.answer) correct++;
                }
            }
            var rate = total > 0 ? Math.round(correct / total * 100) : 0;
            var otherCount = currentPractice.questions.filter(function(q) { return q.type === 'short' || q.type === 'fill'; }).length;
            var msg = '练习完成！\n';
            if (otherCount > 0) msg += '选择题/多选题/判断题: ' + correct + '/' + total + ' (' + rate + '%)\n填空题/简答题: ' + otherCount + ' 题（需人工评分）';
            else msg += '正确: ' + correct + '/' + total + '\n正确率: ' + rate + '%';
            alert(msg);
            showPage('home');
            updateStats();
        }

        function renderWrongList() {
            document.getElementById('wrong-count').textContent = wrongAnswers.length;
            var container = document.getElementById('wrong-list');
            if (wrongAnswers.length === 0) { container.innerHTML = '<div class="empty-state"><p>错题本为空</p></div>'; return; }
            var typeNames = { choice: '选择题', multi: '多选题', judge: '判断题', fill: '填空题', short: '简答题' };
            var html = '';
            for (var i = 0; i < wrongAnswers.length; i++) {
                var w = wrongAnswers[i];
                var q = null;
                for (var j = 0; j < questions.length; j++) { if (questions[j].id === w.questionId) { q = questions[j]; break; } }
                if (!q) continue;
                html += '<div class="wrong-item">';
                html += '<span class="question-type type-' + q.type + '">' + typeNames[q.type] + '</span>';
                html += '<div class="question">' + q.text + '</div>';
                html += '<div class="your-answer">你的答案: ' + w.yourAnswer + '</div>';
                html += '<div class="correct-answer">正确答案: ' + q.answer + '</div>';
                if (q.explain) html += '<div style="margin-top:8px;font-size:13px;color:#666;">解析: ' + q.explain + '</div>';
                html += '<button class="btn btn-secondary btn-small" style="margin-top:12px;" onclick="removeFromWrong(' + q.id + ')">移除</button>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function removeFromWrong(id) {
            wrongAnswers = wrongAnswers.filter(function(w) { return w.questionId !== id; });
            saveData();
            renderWrongList();
        }

        function clearWrongBook() {
            if (confirm('确定清空错题本？')) { wrongAnswers = []; saveData(); renderWrongList(); }
        }

        init();
    </script>
</body>
</html>
