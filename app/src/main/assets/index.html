<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷题助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-danger {
            background: #ff4757;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: #666;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .question-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #667eea;
        }
        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.correct {
            border-color: #2ed573;
            background: #e8f9ef;
        }
        .option.wrong {
            border-color: #ff4757;
            background: #ffe8ea;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        .progress {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .answer-reveal {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }
        .answer-reveal strong {
            color: #856404;
        }
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .nav .btn {
            flex: 1;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .tab-bar {
            display: flex;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .wrong-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #ff4757;
        }
        .wrong-item .question {
            font-weight: 500;
            margin-bottom: 8px;
        }
        .wrong-item .your-answer {
            color: #ff4757;
            font-size: 14px;
        }
        .wrong-item .correct-answer {
            color: #2ed573;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 刷题助手</h1>
            <p>高效学习，本地存储</p>
        </div>

        <div class="tab-bar">
            <div class="tab active" onclick="showPage('home')">首页</div>
            <div class="tab" onclick="showPage('questions')">题库</div>
            <div class="tab" onclick="showPage('practice')">练习</div>
            <div class="tab" onclick="showPage('wrong')">错题</div>
        </div>

        <!-- 首页 -->
        <div id="page-home">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-practiced">0</div>
                    <div class="stat-label">已练习</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-correct">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-wrong">0</div>
                    <div class="stat-label">错题数</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">快速开始</div>
                <button class="btn" onclick="startPractice('random')">🎲 随机练习</button>
                <button class="btn btn-secondary" onclick="startPractice('sequence')">📝 顺序练习</button>
                <button class="btn btn-secondary" onclick="startPractice('wrong')">❌ 错题练习</button>
            </div>

            <div class="card">
                <div class="card-title">练习设置</div>
                <div class="form-group">
                    <label>每次练习题数</label>
                    <input type="number" id="practice-count" value="10" min="1" max="100">
                </div>
            </div>
        </div>

        <!-- 题库管理 -->
        <div id="page-questions" class="hidden">
            <div class="card">
                <div class="card-title">添加题目</div>
                <div class="form-group">
                    <label>题目内容</label>
                    <textarea id="q-text" placeholder="请输入题目内容..."></textarea>
                </div>
                <div class="form-group">
                    <label>选项A</label>
                    <input type="text" id="q-a" placeholder="选项A">
                </div>
                <div class="form-group">
                    <label>选项B</label>
                    <input type="text" id="q-b" placeholder="选项B">
                </div>
                <div class="form-group">
                    <label>选项C</label>
                    <input type="text" id="q-c" placeholder="选项C">
                </div>
                <div class="form-group">
                    <label>选项D</label>
                    <input type="text" id="q-d" placeholder="选项D">
                </div>
                <div class="form-group">
                    <label>正确答案</label>
                    <select id="q-answer">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>答案解析（可选）</label>
                    <textarea id="q-explain" placeholder="输入解析..."></textarea>
                </div>
                <button class="btn" onclick="addQuestion()">添加题目</button>
            </div>

            <div class="card">
                <div class="card-title">批量导入</div>
                <div class="form-group">
                    <label>粘贴题目（每行一题，格式：题目|A选项|B选项|C选项|D选项|答案|解析）</label>
                    <textarea id="q-batch" rows="6" placeholder="示例：&#10;1+1等于几？|1|2|3|4|B|基础数学"></textarea>
                </div>
                <button class="btn btn-secondary" onclick="batchImport()">批量导入</button>
            </div>

            <div id="questions-list"></div>
        </div>

        <!-- 练习页面 -->
        <div id="page-practice" class="hidden">
            <div class="progress">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
            <div id="practice-info" style="text-align:center; margin-bottom:12px; color:#666;">
                <span id="current-num">1</span> / <span id="total-num">10</span>
            </div>
            <div id="practice-content"></div>
            <div class="nav" id="practice-nav">
                <button class="btn btn-secondary" onclick="showAnswer()">👁️ 显示答案</button>
                <button class="btn btn-secondary" onclick="addToWrong()">❌ 加入错题</button>
            </div>
            <div class="nav">
                <button class="btn btn-secondary" onclick="prevQuestion()">上一题</button>
                <button class="btn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>

        <!-- 错题本 -->
        <div id="page-wrong" class="hidden">
            <div class="card">
                <div class="card-title">错题列表 (<span id="wrong-count">0</span>题)</div>
                <button class="btn btn-danger" onclick="clearWrongBook()">清空错题本</button>
            </div>
            <div id="wrong-list"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let questions = [];
        let wrongAnswers = [];
        let practiceHistory = { total: 0, correct: 0 };
        let currentPractice = { questions: [], index: 0, answers: {} };
        let currentPage = 'home';

        // 初始化
        function init() {
            loadData();
            updateStats();
            showPage('home');
        }

        // 本地存储
        function loadData() {
            try {
                questions = JSON.parse(localStorage.getItem('quiz_questions') || '[]');
                wrongAnswers = JSON.parse(localStorage.getItem('quiz_wrong') || '[]');
                practiceHistory = JSON.parse(localStorage.getItem('quiz_history') || '{"total":0,"correct":0}');
            } catch(e) {
                console.error('加载数据失败', e);
            }
        }

        function saveData() {
            localStorage.setItem('quiz_questions', JSON.stringify(questions));
            localStorage.setItem('quiz_wrong', JSON.stringify(wrongAnswers));
            localStorage.setItem('quiz_history', JSON.stringify(practiceHistory));
        }

        // 页面切换
        function showPage(page) {
            document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('page-' + page).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[['home','questions','practice','wrong'].indexOf(page)].classList.add('active');
            currentPage = page;
            
            if (page === 'home') updateStats();
            if (page === 'questions') renderQuestionsList();
            if (page === 'wrong') renderWrongList();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('stat-total').textContent = questions.length;
            document.getElementById('stat-practiced').textContent = practiceHistory.total;
            document.getElementById('stat-correct').textContent = 
                practiceHistory.total > 0 ? Math.round(practiceHistory.correct / practiceHistory.total * 100) + '%' : '0%';
            document.getElementById('stat-wrong').textContent = wrongAnswers.length;
        }

        // 添加题目
        function addQuestion() {
            const q = {
                id: Date.now(),
                text: document.getElementById('q-text').value.trim(),
                options: {
                    A: document.getElementById('q-a').value.trim(),
                    B: document.getElementById('q-b').value.trim(),
                    C: document.getElementById('q-c').value.trim(),
                    D: document.getElementById('q-d').value.trim()
                },
                answer: document.getElementById('q-answer').value,
                explain: document.getElementById('q-explain').value.trim()
            };
            
            if (!q.text || !q.options.A || !q.options.B) {
                alert('请填写题目和至少两个选项');
                return;
            }
            
            questions.push(q);
            saveData();
            
            // 清空表单
            ['q-text', 'q-a', 'q-b', 'q-c', 'q-d', 'q-explain'].forEach(id => {
                document.getElementById(id).value = '';
            });
            
            alert('添加成功！');
            renderQuestionsList();
        }

        // 批量导入
        function batchImport() {
            const text = document.getElementById('q-batch').value.trim();
            if (!text) return;
            
            const lines = text.split('\n').filter(l => l.trim());
            let count = 0;
            
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length >= 6) {
                    questions.push({
                        id: Date.now() + count,
                        text: parts[0].trim(),
                        options: {
                            A: parts[1].trim(),
                            B: parts[2].trim(),
                            C: parts[3].trim(),
                            D: parts[4].trim()
                        },
                        answer: parts[5].trim().toUpperCase(),
                        explain: parts[6] ? parts[6].trim() : ''
                    });
                    count++;
                }
            });
            
            saveData();
            document.getElementById('q-batch').value = '';
            alert('成功导入 ' + count + ' 道题目');
            renderQuestionsList();
        }

        // 渲染题目列表
        function renderQuestionsList() {
            const container = document.getElementById('questions-list');
            if (questions.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无题目，请添加题目</p></div>';
                return;
            }
            
            let html = '';
            questions.slice(0, 20).forEach((q, i) => {
                html += '<div class="card">' +
                    '<div class="question-text">' + (i + 1) + '. ' + q.text + '</div>' +
                    '<div style="color: #2ed573; font-size: 14px;">答案: ' + q.answer + '</div>' +
                    '<button class="btn btn-secondary" style="margin-top: 8px; width: auto; padding: 6px 12px;" onclick="deleteQuestion(' + q.id + ')">删除</button>' +
                '</div>';
            });
            
            if (questions.length > 20) {
                html += '<p style="text-align:center;color:#666;">显示前20题，共' + questions.length + '题</p>';
            }
            
            container.innerHTML = html;
        }

        // 删除题目
        function deleteQuestion(id) {
            if (confirm('确定删除此题目？')) {
                questions = questions.filter(q => q.id !== id);
                saveData();
                renderQuestionsList();
            }
        }

        // 开始练习
        function startPractice(mode) {
            if (questions.length === 0) {
                alert('题库为空，请先添加题目');
                return;
            }
            
            const count = parseInt(document.getElementById('practice-count').value) || 10;
            let pool = [];
            
            if (mode === 'wrong') {
                pool = wrongAnswers.map(w => questions.find(q => q.id === w.questionId)).filter(q => q);
                if (pool.length === 0) {
                    alert('错题本为空');
                    return;
                }
            } else {
                pool = [...questions];
            }
            
            if (mode === 'random') {
                pool = pool.sort(function() { return Math.random() - 0.5; });
            }
            
            currentPractice = {
                questions: pool.slice(0, count),
                index: 0,
                answers: {},
                showedAnswer: false
            };
            
            showPage('practice');
            renderQuestion();
        }

        // 渲染当前题目
        function renderQuestion() {
            const q = currentPractice.questions[currentPractice.index];
            if (!q) {
                finishPractice();
                return;
            }
            
            const total = currentPractice.questions.length;
            const current = currentPractice.index + 1;
            
            document.getElementById('current-num').textContent = current;
            document.getElementById('total-num').textContent = total;
            document.getElementById('progress-bar').style.width = (current / total * 100) + '%';
            
            const userAnswer = currentPractice.answers[q.id];
            
            let html = '<div class="question-card"><div class="question-text">' + q.text + '</div><div class="options">';
            
            ['A', 'B', 'C', 'D'].forEach(function(opt) {
                if (q.options[opt]) {
                    let className = 'option';
                    if (userAnswer === opt) className += ' selected';
                    if (currentPractice.showedAnswer) {
                        if (opt === q.answer) className += ' correct';
                        else if (userAnswer === opt) className += ' wrong';
                    }
                    html += '<div class="' + className + '" onclick="selectAnswer(\'' + opt + '\')">' + opt + '. ' + q.options[opt] + '</div>';
                }
            });
            
            html += '</div>';
            
            if (currentPractice.showedAnswer) {
                html += '<div class="answer-reveal"><strong>正确答案: ' + q.answer + '</strong>';
                if (q.explain) {
                    html += '<p style="margin-top:8px;">解析: ' + q.explain + '</p>';
                }
                html += '</div>';
            }
            
            html += '</div>';
            
            document.getElementById('practice-content').innerHTML = html;
            currentPractice.showedAnswer = false;
        }

        // 选择答案
        function selectAnswer(opt) {
            const q = currentPractice.questions[currentPractice.index];
            currentPractice.answers[q.id] = opt;
            renderQuestion();
        }

        // 显示答案
        function showAnswer() {
            currentPractice.showedAnswer = true;
            renderQuestion();
        }

        // 加入错题
        function addToWrong() {
            const q = currentPractice.questions[currentPractice.index];
            const userAnswer = currentPractice.answers[q.id];
            
            if (!userAnswer) {
                alert('请先选择答案');
                return;
            }
            
            if (userAnswer !== q.answer) {
                if (!wrongAnswers.find(function(w) { return w.questionId === q.id; })) {
                    wrongAnswers.push({
                        questionId: q.id,
                        yourAnswer: userAnswer,
                        time: Date.now()
                    });
                    saveData();
                    alert('已加入错题本');
                } else {
                    alert('该题已在错题本中');
                }
            } else {
                alert('答案正确，无需加入错题本');
            }
        }

        // 上一题
        function prevQuestion() {
            if (currentPractice.index > 0) {
                currentPractice.index--;
                renderQuestion();
            }
        }

        // 下一题
        function nextQuestion() {
            currentPractice.index++;
            if (currentPractice.index >= currentPractice.questions.length) {
                finishPractice();
            } else {
                renderQuestion();
            }
        }

        // 完成练习
        function finishPractice() {
            let correct = 0;
            currentPractice.questions.forEach(function(q) {
                if (currentPractice.answers[q.id] === q.answer) {
                    correct++;
                }
            });
            
            const total = currentPractice.questions.length;
            practiceHistory.total += total;
            practiceHistory.correct += correct;
            saveData();
            
            alert('练习完成！\n正确: ' + correct + '/' + total + '\n正确率: ' + Math.round(correct/total*100) + '%');
            showPage('home');
        }

        // 渲染错题列表
        function renderWrongList() {
            document.getElementById('wrong-count').textContent = wrongAnswers.length;
            const container = document.getElementById('wrong-list');
            
            if (wrongAnswers.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>错题本为空</p></div>';
                return;
            }
            
            let html = '';
            wrongAnswers.forEach(function(w) {
                const q = questions.find(function(item) { return item.id === w.questionId; });
                if (!q) return;
                html += '<div class="wrong-item">' +
                    '<div class="question">' + q.text + '</div>' +
                    '<div class="your-answer">你的答案: ' + w.yourAnswer + '</div>' +
                    '<div class="correct-answer">正确答案: ' + q.answer + '</div>' +
                    '<button class="btn btn-secondary" style="margin-top: 8px; width: auto; padding: 6px 12px;" onclick="removeFromWrong(' + q.id + ')">移除</button>' +
                '</div>';
            });
            
            container.innerHTML = html;
        }

        // 移除错题
        function removeFromWrong(id) {
            wrongAnswers = wrongAnswers.filter(function(w) { return w.questionId !== id; });
            saveData();
            renderWrongList();
        }

        // 清空错题本
        function clearWrongBook() {
            if (confirm('确定清空错题本？')) {
                wrongAnswers = [];
                saveData();
                renderWrongList();
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
